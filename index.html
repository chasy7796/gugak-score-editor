<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국악 악보 인식 및 MIDI</title>
<style>
*{box-sizing:border-box}
body{
  font-family:system-ui,sans-serif;
  max-width:900px;
  margin:auto;
  padding:14px;
  background:#f4f7fb;
  color:#182230
}
.panel{
  background:white;
  border:1px solid #dbe2ec;
  border-radius:12px;
  padding:14px;
  margin:12px 0
}
button,input,select{
  font:inherit;
  padding:9px;
  border:1px solid #c5cfdd;
  border-radius:8px
}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.primary{background:#155bd7;color:white;border-color:#155bd7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
#preview{
  display:block;
  max-width:100%;
  max-height:450px;
  margin:12px auto
}
#status{color:#155bd7;min-height:24px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:7px;border-bottom:1px solid #ddd}
td input,td select{max-width:100%;width:100%}
.small{font-size:13px;color:#596579;line-height:1.5}
h2{font-size:23px}
@media(max-width:500px){
  body{padding:8px}
  .panel{padding:10px}
  td,th{padding:5px;font-size:13px}
  td input,td select{padding:6px}
}
</style>
</head>
<body>
<h2>🥁 국악 악보 인식 · MIDI</h2>
<p class="small">
  악보 JPG/PNG/WebP 이미지를 올리고 인식 버튼을 누르세요.
  자동 인식은 음표 후보를 추출하는 보조 기능입니다.
  인식 결과를 확인하고 필요하면 직접 수정해 주세요.
</p>
<section class="panel">
  <div class="row">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
    <button id="recognize" class="primary">악보 인식</button>
  </div>
  <div class="row">
    <label>악기
      <select id="instrument">
        <option value="buk">북</option>
        <option value="janggu">장구</option>
        <option value="jing">징</option>
        <option value="kkwaeng">꽹과리</option>
        <option value="wood">목탁</option>
        <option value="snare">스네어</option>
        <option value="hat">하이햇</option>
      </select>
    </label>
    <label>빠르기
      <input id="tempo" type="number" min="30" max="240" value="100" style="width:75px">
      BPM
    </label>
  </div>
  <img id="preview" hidden alt="악보 미리보기">
  <div id="status" aria-live="polite">먼저 악보 이미지를 선택하세요.</div>
</section>
<section class="panel">
  <div class="row">
    <button id="play" class="primary">▶ 재생</button>
    <button id="stop">■ 정지</button>
    <button id="midi">MIDI 저장</button>
    <button id="add">＋ 음표 추가</button>
  </div>
  <p class="small">
    위치 값은 음표가 재생되는 시간 순서와 간격에 사용됩니다.
    음표의 위치, 악기, 길이를 표에서 수정할 수 있습니다.
  </p>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>위치</th>
          <th>악기</th>
          <th>길이(박)</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5">인식 결과가 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
</section>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const file = $('file');
const preview = $('preview');
const status = $('status');
const rows = $('rows');
let img = null;
let notes = [];
let audio = null;
let playbackNodes = [];
let imageUrl = null;
const instruments = {
  buk:     {label:'북',     gm:36, f:95},
  janggu:  {label:'장구',   gm:38, f:150},
  jing:    {label:'징',     gm:49, f:900},
  kkwaeng: {label:'꽹과리', gm:56, f:1450},
  wood:    {label:'목탁',   gm:76, f:550},
  snare:   {label:'스네어', gm:40, f:190},
  hat:     {label:'하이햇', gm:42, f:7000}
};
/* 이미지 업로드 */
file.addEventListener('change', () => {
  const f = file.files && file.files[0];
  img = null;
  notes = [];
  render();
  if (imageUrl) {
    URL.revokeObjectURL(imageUrl);
    imageUrl = null;
  }
  preview.hidden = true;
  if (!f) {
    status.textContent = '이미지 파일을 선택해 주세요.';
    return;
  }
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) {
    status.textContent = 'JPG, PNG 또는 WebP 이미지 파일을 선택해 주세요.';
    return;
  }
  imageUrl = URL.createObjectURL(f);
  const next = new Image();
  next.onload = () => {
    img = next;
    preview.src = imageUrl;
    preview.hidden = false;
    status.textContent =
      `이미지 준비 완료 (${next.naturalWidth} × ${next.naturalHeight}). 악보 인식 버튼을 눌러 주세요.`;
  };
  next.onerror = () => {
    status.textContent = '이미지를 읽지 못했습니다. 다른 이미지 파일을 선택해 주세요.';
  };
  next.src = imageUrl;
});
/* 표 렌더링 */
function render() {
  rows.replaceChildren();
  if (!notes.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = '인식 결과가 없습니다.';
    tr.append(td);
    rows.append(tr);
    return;
  }
  notes.forEach((n, i) => {
    const tr = document.createElement('tr');
    const number = document.createElement('td');
    number.textContent = i + 1;
    tr.append(number);
    const posCell = document.createElement('td');
    const pos = document.createElement('input');
    pos.type = 'number';
    pos.min = '0';
    pos.step = '1';
    pos.value = n.x;
    pos.addEventListener('change', () => {
      n.x = Math.max(0, Number(pos.value) || 0);
    });
    posCell.append(pos);
    tr.append(posCell);
    const instCell = document.createElement('td');
    const inst = document.createElement('select');
    Object.entries(instruments).forEach(([key, val]) => {
      const op = document.createElement('option');
      op.value = key;
      op.textContent = val.label;
      op.selected = n.inst === key;
      inst.append(op);
    });
    inst.addEventListener('change', () => {
      n.inst = inst.value;
    });
    instCell.append(inst);
    tr.append(instCell);
    const durCell = document.createElement('td');
    const dur = document.createElement('select');
    [0.25, 0.5, 1, 1.5, 2, 3, 4].forEach(v => {
      const op = document.createElement('option');
      op.value = v;
      op.textContent = v;
      op.selected = n.dur === v;
      dur.append(op);
    });
    dur.addEventListener('change', () => {
      n.dur = Number(dur.value);
    });
    durCell.append(dur);
    tr.append(durCell);
    const delCell = document.createElement('td');
    const del = document.createElement('button');
    del.textContent = '삭제';
    del.addEventListener('click', () => {
      notes.splice(i, 1);
      render();
    });
    delCell.append(del);
    tr.append(delCell);
    rows.append(tr);
  });
}
/*
 * 악보 인식
 * 1. 이미지를 축소하여 처리
 * 2. 어두운 픽셀을 이진화
 * 3. 긴 가로 오선 후보를 검출
 * 4. 오선 위치의 픽셀을 제거
 * 5. 남은 연결 성분에서 음표 후보를 추출
 *
 * 주의: 이 방식은 완전한 악보 판독기가 아닙니다.
 * 기호, 음표 종류, 쉼표, 박자 등을 완벽하게 해석하지는 못합니다.
 */
function recognize(image) {
  const maxW = 1000;
  const maxH = 1400;
  const scale = Math.min(
    1,
    maxW / image.naturalWidth,
    maxH / image.naturalHeight
  );
  const w = Math.max(1, Math.round(image.naturalWidth * scale));
  const h = Math.max(1, Math.round(image.naturalHeight * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  if (!ctx) {
    throw new Error('이미지 분석 기능을 사용할 수 없습니다.');
  }
  ctx.drawImage(image, 0, 0, w, h);
  const pixels = ctx.getImageData(0, 0, w, h).data;
  const dark = new Uint8Array(w * h);
  /* 이미지 이진화 */
  for (let p = 0, j = 0; p < pixels.length; p += 4, j++) {
    const gray =
      0.299 * pixels[p] +
      0.587 * pixels[p + 1] +
      0.114 * pixels[p + 2];
    dark[j] = gray < 160 ? 1 : 0;
  }
  /*
   * 가로 방향의 어두운 픽셀 비율을 이용해
   * 오선의 각 가로줄을 찾습니다.
   */
  const rowRatio = new Float32Array(h);
  for (let y = 0; y < h; y++) {
    let count = 0;
    const offset = y * w;
    for (let x = 0; x < w; x++) {
      count += dark[offset + x];
    }
    rowRatio[y] = count / w;
  }
  const rawLineYs = [];
  for (let y = 0; y < h; y++) {
    if (rowRatio[y] > 0.48) {
      rawLineYs.push(y);
    }
  }
  /* 인접한 행을 하나의 가로줄 후보로 묶습니다. */
  const lines = [];
  for (const y of rawLineYs) {
    if (
      !lines.length ||
      y - lines[lines.length - 1].end > 2
    ) {
      lines.push({start:y, end:y, center:y});
    } else {
      const last = lines[lines.length - 1];
      last.end = y;
      last.center = Math.round((last.start + last.end) / 2);
    }
  }
  const lineCenters = lines.map(v => v.center);
  /*
   * 다섯 줄의 간격이 대략 일정한 그룹을 찾아
   * 오선 후보로 등록합니다.
   */
  const staffs = [];
  for (let i = 0; i + 4 < lineCenters.length; i++) {
    const group = lineCenters.slice(i, i + 5);
    const gaps = group.slice(1).map((v, j) => v - group[j]);
    const avg = gaps.reduce((a, b) => a + b, 0) / 4;
    const regular =
      avg >= 2 &&
      avg <= 35 &&
      gaps.every(v => Math.abs(v - avg) < avg * 0.65);
    if (regular) {
      staffs.push({
        ys: group,
        space: avg
      });
      i += 4;
    }
  }
  if (!staffs.length) {
    throw new Error(
      '오선을 찾지 못했습니다. 오선 다섯 줄이 선명하게 보이도록 이미지를 자르거나 더 선명한 사진을 사용해 주세요.'
    );
  }
  /*
   * 오선 픽셀을 복사본에서 제거합니다.
   * 원본 이미지는 그대로 유지합니다.
   */
  const cleaned = new Uint8Array(dark);
  for (const staff of staffs) {
    for (const y of staff.ys) {
      const from = Math.max(0, y - 1);
      const to = Math.min(h - 1, y + 1);
      for (let yy = from; yy <= to; yy++) {
        const offset = yy * w;
        for (let x = 0; x < w; x++) {
          cleaned[offset + x] = 0;
        }
      }
    }
  }
  /*
   * 연결 성분 분석.
   * 오선 제거 후 남은 잉크 덩어리를 분석합니다.
   */
  const visited = new Uint8Array(w * h);
  const found = [];
  const maxComponents = 20000;
  let componentCount = 0;
  for (let sy = 1; sy < h - 1; sy++) {
    for (let sx = 1; sx < w - 1; sx++) {
      const start = sy * w + sx;
      if (!cleaned[start] || visited[start]) continue;
      const stack = [start];
      visited[start] = 1;
      let minX = sx;
      let maxX = sx;
      let minY = sy;
      let maxY = sy;
      let area = 0;
      while (stack.length) {
        const p = stack.pop();
        const x = p % w;
        const y = Math.floor(p / w);
        area++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (
              nx <= 0 || nx >= w - 1 ||
              ny <= 0 || ny >= h - 1
            ) {
              continue;
            }
            const np = ny * w + nx;
            if (cleaned[np] && !visited[np]) {
              visited[np] = 1;
              stack.push(np);
            }
          }
        }
      }
      componentCount++;
      if (componentCount > maxComponents) {
        throw new Error(
          '이미지의 작은 요소가 너무 많습니다. 이미지를 자르거나 해상도를 낮춰 주세요.'
        );
      }
      const bw = maxX - minX + 1;
      const bh = maxY - minY + 1;
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      /* 너무 작은 점이나 너무 큰 덩어리를 제외합니다. */
      if (
        area < 7 ||
        bw < 3 ||
        bh < 3 ||
        bw > w * 0.12 ||
        bh > h * 0.12
      ) {
        continue;
      }
      /* 오선 영역 안에 있는 후보만 사용합니다. */
      let staff = null;
      for (const s of staffs) {
        const top = s.ys[0] - s.space * 1.5;
        const bottom = s.ys[4] + s.space * 1.5;
        if (cy >= top && cy <= bottom) {
          staff = s;
          break;
        }
      }
      if (!staff) continue;
      const ratio = bw / bh;
      /*
       * 음표 머리 또는 타악기 기호 후보를 느슨하게 추립니다.
       * 실제 악보 기호를 정확히 분류하는 단계는 아닙니다.
       */
      if (
        ratio < 0.35 ||
        ratio > 3.2 ||
        area < staff.space * staff.space * 0.04
      ) {
        continue;
      }
      found.push({
        x: Math.round(cx / scale),
        inst: $('instrument').value,
        dur: 1
      });
    }
  }
  /* 왼쪽부터 오른쪽 순으로 정렬합니다. */
  found.sort((a, b) => a.x - b.x);
  /*
   * 가까운 위치에서 중복 검출된 후보를 합칩니다.
   * 간격은 원본 이미지 기준으로 계산합니다.
   */
  const unique = [];
  for (const n of found) {
    const duplicate = unique.some(
      v => Math.abs(v.x - n.x) < Math.max(6, 8 / scale)
    );
    if (!duplicate) {
      unique.push(n);
    }
  }
  return unique;
}
/* 인식 버튼 */
$('recognize').addEventListener('click', () => {
  if (!img || !img.complete || !img.naturalWidth) {
    status.textContent =
      '먼저 이미지 파일을 선택하고 준비 완료 메시지가 나올 때까지 기다려 주세요.';
    return;
  }
  const btn = $('recognize');
  btn.disabled = true;
  status.textContent = '악보를 분석하고 있습니다. 잠시 기다려 주세요.';
  setTimeout(() => {
    try {
      notes = recognize(img);
      render();
      status.textContent = notes.length
        ? `음표 후보 ${notes.length}개를 찾았습니다. 표에서 결과를 확인해 주세요.`
        : '음표 후보를 찾지 못했습니다. 더 선명한 이미지를 사용하거나 음표 추가 버튼으로 입력해 주세요.';
    } catch (e) {
      console.error(e);
      status.textContent = '인식 오류: ' + (e.message || '알 수 없는 오류');
    } finally {
      btn.disabled = false;
    }
  }, 30);
});
/* 음표 수동 추가 */
$('add').addEventListener('click', () => {
  notes.push({
    x: notes.length ? notes[notes.length - 1].x + 50 : 0,
    inst: $('instrument').value,
    dur: 1
  });
  render();
});
/* 오디오 준비 */
function getAudio() {
  if (!audio) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) {
      throw new Error('이 브라우저는 오디오 재생을 지원하지 않습니다.');
    }
    audio = new AudioCtx();
  }
  return audio;
}
/* 예약된 음향 노드를 정리합니다. */
function clearPlaybackNodes() {
  for (const node of playbackNodes) {
    try {
      node.stop();
    } catch (_) {}
    try {
      node.disconnect();
    } catch (_) {}
  }
  playbackNodes = [];
}
/* 타악기 음향 생성 */
function playHit(inst, when, dur) {
  const a = getAudio();
  const osc = a.createOscillator();
  const gain = a.createGain();
  const cfg = instruments[inst] || instruments.buk;
  osc.type = ['jing', 'kkwaeng', 'hat'].includes(inst)
    ? 'square'
    : 'triangle';
  osc.frequency.setValueAtTime(cfg.f, when);
  if (['buk', 'janggu'].includes(inst)) {
    osc.frequency.exponentialRampToValueAtTime(42, when + 0.13);
  }
  osc.connect(gain);
  gain.connect(a.destination);
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(
    ['jing', 'kkwaeng'].includes(inst) ? 0.16 : 0.5,
    when + 0.008
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    when + Math.max(0.07, Math.min(0.7, dur * 0.18))
  );
  osc.start(when);
  osc.stop(when + 0.9);
  playbackNodes.push(osc, gain);
}
/* 재생 */
$('play').addEventListener('click', async () => {
  if (!notes.length) {
    status.textContent = '먼저 악보를 인식하거나 음표를 추가하세요.';
    return;
  }
  try {
    const a = getAudio();
    await a.resume();
    clearPlaybackNodes();
    const bpm = Math.max(
      30,
      Math.min(240, Number($('tempo').value) || 100)
    );
    const sorted = [...notes].sort((a, b) => a.x - b.x);
    let t = a.currentTime + 0.08;
    let prev = sorted[0].x;
    sorted.forEach((n, i) => {
      if (i > 0) {
        const distance = Math.max(0, n.x - prev);
        t += Math.max(0.08, Math.min(2, (distance / 50) * (60 / bpm)));
      }
      playHit(n.inst, t, n.dur);
      prev = n.x;
    });
    status.textContent = '재생을 시작했습니다.';
  } catch (e) {
    status.textContent = '재생 오류: ' + (e.message || e);
  }
});
/* 정지 */
$('stop').addEventListener('click', async () => {
  clearPlaybackNodes();
  if (audio) {
    try {
      await audio.suspend();
    } catch (_) {}
  }
  status.textContent = '재생을 정지했습니다.';
});
/* MIDI 가변 길이 수 */
function vlq(v) {
  const out = [v & 127];
  while ((v = Math.floor(v / 128)) > 0) {
    out.unshift((v & 127) | 128);
  }
  return out;
}
/* 파일 저장 */
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
/* MIDI 파일 생성 */
$('midi').addEventListener('click', () => {
  if (!notes.length) {
    status.textContent = '저장할 음표가 없습니다.';
    return;
  }
  try {
    const bpm = Math.max(
      30,
      Math.min(240, Number($('tempo').value) || 100)
    );
    const us = Math.round(60000000 / bpm);
    /* MIDI 템포 메타 이벤트 */
    const events = [[
      0,
      [0xFF, 0x51, 0x03, (us >> 16) & 255, (us >> 8) & 255, us & 255]
    ]];
    [...notes]
      .sort((a, b) => a.x - b.x)
      .forEach(n => {
        const tick = Math.round((Math.max(0, n.x) / 50) * 120);
        const len = Math.max(30, Math.round(120 * n.dur));
        const gm = (instruments[n.inst] || instruments.buk).gm;
        /* MIDI 드럼 채널 10: 0-based channel 9 */
        events.push(
          [tick, [0x99, gm, 100]],
          [tick + len, [0x89, gm, 0]]
        );
      });
    events.sort((a, b) => a[0] - b[0]);
    const track = [];
    let last = 0;
    for (const [tick, data] of events) {
      track.push(...vlq(Math.max(0, tick - last)), ...data);
      last = tick;
    }
    track.push(0, 0xFF, 0x2F, 0);
    const len = track.length;
    const header = [
      0x4D,0x54,0x68,0x64,
      0,0,0,6,
      0,0,
      0,1,
      1,224,
      0x4D,0x54,0x72,0x6B,
      (len >>> 24) & 255,
      (len >>> 16) & 255,
      (len >>> 8) & 255,
      len & 255,
      ...track
    ];
    saveBlob(
      new Blob([new Uint8Array(header)], {type:'audio/midi'}),
      'gugak-score.mid'
    );
    status.textContent = 'MIDI 파일을 생성했습니다.';
  } catch (e) {
    console.error(e);
    status.textContent = 'MIDI 저장 오류: ' + (e.message || e);
  }
});
})();
</script>
</body>
