<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국악 악보 인식 및 MIDI</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:14px;background:#f4f7fb;color:#182230}
.panel{background:white;border:1px solid #dbe2ec;border-radius:12px;padding:14px;margin:12px 0}
button,input,select{font:inherit;padding:9px;border:1px solid #c5cfdd;border-radius:8px}
button{cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#155bd7;color:white;border-color:#155bd7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
#preview{display:block;max-width:100%;max-height:500px;margin:12px auto}
#status{color:#155bd7;min-height:24px;overflow-wrap:anywhere;line-height:1.5}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:7px;border-bottom:1px solid #ddd}
td input,td select{max-width:100%;width:100%}
.small{font-size:13px;color:#596579;line-height:1.5}
</style>
</head>
<body>
<h2>🥁 국악 악보 인식 · MIDI</h2>
<p class="small">
  악보 JPG/PNG/WebP를 올린 뒤 인식 버튼을 누르세요.
  인식 결과는 자동 추출한 후보이며, 실제 악보의 기호와 박자를
  완전히 판독하는 기능은 아닙니다.
</p>
<section class="panel">
  <div class="row">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
    <button id="recognize" class="primary">악보 인식</button>
  </div>
  <div class="row">
    <label>악기
      <select id="instrument">
        <option value="buk">북</option>
        <option value="janggu">장구</option>
        <option value="jing">징</option>
        <option value="kkwaeng">꽹과리</option>
        <option value="wood">목탁</option>
        <option value="snare">스네어</option>
        <option value="hat">하이햇</option>
      </select>
    </label>
    <label>빠르기
      <input id="tempo" type="number" min="30" max="240" value="100" style="width:75px">
      BPM
    </label>
  </div>
  <img id="preview" hidden alt="악보 미리보기">
  <div id="status" aria-live="polite">먼저 악보 이미지를 선택하세요.</div>
</section>
<section class="panel">
  <div class="row">
    <button id="play" class="primary">▶ 재생</button>
    <button id="stop">■ 정지</button>
    <button id="midi">MIDI 저장</button>
    <button id="add">＋ 음표 추가</button>
  </div>
  <p class="small">
    위치 값은 음표 사이의 시간 간격에 사용됩니다.
    인식 결과를 확인하고 위치, 악기, 길이를 수정하세요.
  </p>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr><th>#</th><th>위치</th><th>악기</th><th>길이(박)</th><th>삭제</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5">인식 결과가 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
</section>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const file = $('file');
const preview = $('preview');
const status = $('status');
const rows = $('rows');
let img = null;
let notes = [];
let audio = null;
let playbackNodes = [];
let imageUrl = null;
const instruments = {
  buk:     {label:'북',gm:36,f:95},
  janggu:  {label:'장구',gm:38,f:150},
  jing:    {label:'징',gm:49,f:900},
  kkwaeng: {label:'꽹과리',gm:56,f:1450},
  wood:    {label:'목탁',gm:76,f:550},
  snare:   {label:'스네어',gm:40,f:190},
  hat:     {label:'하이햇',gm:42,f:7000}
};
/* 이미지 업로드 */
file.addEventListener('change', () => {
  const f = file.files && file.files[0];
  img = null;
  notes = [];
  render();
  preview.hidden = true;
  if (imageUrl) {
    URL.revokeObjectURL(imageUrl);
    imageUrl = null;
  }
  if (!f) {
    status.textContent = '이미지 파일을 선택하세요.';
    return;
  }
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) {
    status.textContent = 'JPG, PNG 또는 WebP 파일만 사용할 수 있습니다.';
    return;
  }
  imageUrl = URL.createObjectURL(f);
  const next = new Image();
  next.onload = () => {
    img = next;
    preview.src = imageUrl;
    preview.hidden = false;
    status.textContent =
      `이미지 준비 완료: ${next.naturalWidth} × ${next.naturalHeight}. 인식 버튼을 눌러 주세요.`;
  };
  next.onerror = () => {
    status.textContent = '이미지를 읽지 못했습니다. 다른 파일을 선택하세요.';
  };
  next.src = imageUrl;
});
/* 결과 표 */
function render() {
  rows.replaceChildren();
  if (!notes.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = '인식 결과가 없습니다.';
    tr.append(td);
    rows.append(tr);
    return;
  }
  notes.forEach((n, i) => {
    const tr = document.createElement('tr');
    const num = document.createElement('td');
    num.textContent = i + 1;
    tr.append(num);
    const posCell = document.createElement('td');
    const pos = document.createElement('input');
    pos.type = 'number';
    pos.min = '0';
    pos.step = '1';
    pos.value = n.x;
    pos.addEventListener('change', () => {
      n.x = Math.max(0, Number(pos.value) || 0);
    });
    posCell.append(pos);
    tr.append(posCell);
    const instCell = document.createElement('td');
    const inst = document.createElement('select');
    Object.entries(instruments).forEach(([key, val]) => {
      const op = document.createElement('option');
      op.value = key;
      op.textContent = val.label;
      op.selected = n.inst === key;
      inst.append(op);
    });
    inst.addEventListener('change', () => n.inst = inst.value);
    instCell.append(inst);
    tr.append(instCell);
    const durCell = document.createElement('td');
    const dur = document.createElement('select');
    [0.25,0.5,1,1.5,2,3,4].forEach(v => {
      const op = document.createElement('option');
      op.value = v;
      op.textContent = v;
      op.selected = n.dur === v;
      dur.append(op);
    });
    dur.addEventListener('change', () => n.dur = Number(dur.value));
    durCell.append(dur);
    tr.append(durCell);
    const delCell = document.createElement('td');
    const del = document.createElement('button');
    del.textContent = '삭제';
    del.addEventListener('click', () => {
      notes.splice(i, 1);
      render();
    });
    delCell.append(del);
    tr.append(delCell);
    rows.append(tr);
  });
}
/*
 * 개선된 악보 인식
 * - 여러 밝기 기준으로 선 후보를 탐색
 * - 행별 어두운 픽셀 비율을 부드럽게 계산
 * - 다섯 줄의 간격을 비교하여 오선 후보를 찾음
 * - 오선을 제거한 이미지에서 연결 성분을 분석
 */
function recognize(image) {
  const maxW = 1200;
  const maxH = 1600;
  const scale = Math.min(
    1,
    maxW / image.naturalWidth,
    maxH / image.naturalHeight
  );
  const w = Math.max(1, Math.round(image.naturalWidth * scale));
  const h = Math.max(1, Math.round(image.naturalHeight * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  if (!ctx) throw new Error('이미지 분석 기능을 사용할 수 없습니다.');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(image, 0, 0, w, h);
  const pixels = ctx.getImageData(0, 0, w, h).data;
  const gray = new Uint8Array(w * h);
  for (let p = 0, j = 0; p < pixels.length; p += 4, j++) {
    gray[j] = Math.round(
      0.299 * pixels[p] +
      0.587 * pixels[p + 1] +
      0.114 * pixels[p + 2]
    );
  }
  /*
   * 밝기 기준을 너무 엄격하게 잡지 않습니다.
   * 흐린 회색 선과 스캔 이미지도 후보에 포함합니다.
   */
  const thresholds = [180, 205, 150];
  let best = null;
  for (const threshold of thresholds) {
    const binary = new Uint8Array(w * h);
    for (let i = 0; i < gray.length; i++) {
      binary[i] = gray[i] < threshold ? 1 : 0;
    }
    const rowRatio = new Float32Array(h);
    for (let y = 0; y < h; y++) {
      let count = 0;
      const off = y * w;
      for (let x = 0; x < w; x++) {
        count += binary[off + x];
      }
      rowRatio[y] = count / w;
    }
    /*
     * 3행 이동 평균으로 기울어짐과 두께에 따른
     * 단일 행의 누락을 조금 완화합니다.
     */
    const smooth = new Float32Array(h);
    for (let y = 0; y < h; y++) {
      let sum = 0;
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy >= 0 && yy < h) {
          sum += rowRatio[yy];
          n++;
        }
      }
      smooth[y] = sum / n;
    }
    /*
     * 선 후보: 가로 픽셀 비율이 낮더라도
     * 18% 이상이면 검토합니다.
     */
    const rowCandidates = [];
    const minRatio = 0.18;
    for (let y = 0; y < h; y++) {
      if (smooth[y] >= minRatio) {
        rowCandidates.push(y);
      }
    }
    const rowGroups = [];
    for (const y of rowCandidates) {
      const last = rowGroups[rowGroups.length - 1];
      if (!last || y - last.end > 2) {
        rowGroups.push({start:y, end:y, sum:y, count:1});
      } else {
        last.end = y;
        last.sum += y;
        last.count++;
      }
    }
    const lineCandidates = rowGroups.map(g => ({
      y: Math.round(g.sum / g.count),
      strength: Math.max(...smooth.slice(g.start, g.end + 1))
    }));
    /*
     * 다섯 줄 간격이 유사한 그룹을 찾습니다.
     * 지나치게 넓거나 불규칙한 간격은 제외합니다.
     */
    const staffs = [];
    for (let i = 0; i + 4 < lineCandidates.length; i++) {
      const group = lineCandidates.slice(i, i + 5);
      const ys = group.map(g => g.y);
      const gaps = ys.slice(1).map((v, j) => v - ys[j]);
      const avg = gaps.reduce((a,b) => a+b, 0) / 4;
      if (avg < 2 || avg > 45) continue;
      const regular = gaps.every(
        v => Math.abs(v - avg) <= Math.max(2, avg * 0.55)
      );
      if (!regular) continue;
      const strength =
        group.reduce((sum, g) => sum + g.strength, 0) / 5;
      staffs.push({
        ys,
        space: avg,
        strength
      });
      i += 4;
    }
    if (staffs.length) {
      const score = staffs.length * 10 +
        staffs.reduce((s, v) => s + v.strength, 0);
      if (!best || score > best.score) {
        best = {binary, staffs, score, threshold};
      }
    }
  }
  if (!best) {
    throw new Error(
      '오선을 찾지 못했습니다. 악보가 화면에 크게 보이도록 자르고, 수평에 가깝고 선명한 이미지로 다시 시도해 주세요.'
    );
  }
  const binary = best.binary;
  const staffs = best.staffs;
  /*
   * 각 오선 위치를 제거합니다.
   * 선 두께가 일정하지 않을 수 있어 ±2행을 지웁니다.
   */
  const cleaned = new Uint8Array(binary);
  for (const staff of staffs) {
    for (const y of staff.ys) {
      const top = Math.max(0, Math.floor(y - 2));
      const bottom = Math.min(h - 1, Math.ceil(y + 2));
      for (let yy = top; yy <= bottom; yy++) {
        const off = yy * w;
        for (let x = 0; x < w; x++) {
          cleaned[off + x] = 0;
        }
      }
    }
  }
  /*
   * 연결 성분 분석: 남은 어두운 덩어리의 경계 상자를 계산합니다.
   */
  const visited = new Uint8Array(w * h);
  const components = [];
  const maxComponents = 30000;
  let count = 0;
  for (let sy = 1; sy < h - 1; sy++) {
    for (let sx = 1; sx < w - 1; sx++) {
      const start = sy * w + sx;
      if (!cleaned[start] || visited[start]) continue;
      const stack = [start];
      visited[start] = 1;
      let minX = sx, maxX = sx;
      let minY = sy, maxY = sy;
      let area = 0;
      while (stack.length) {
        const p = stack.pop();
        const x = p % w;
        const y = Math.floor(p / w);
        area++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (nx <= 0 || nx >= w - 1 ||
                ny <= 0 || ny >= h - 1) continue;
            const np = ny * w + nx;
            if (cleaned[np] && !visited[np]) {
              visited[np] = 1;
              stack.push(np);
            }
          }
        }
      }
      count++;
      if (count > maxComponents) {
        throw new Error(
          '분석할 요소가 너무 많습니다. 악보 부분만 잘라서 올려 주세요.'
        );
      }
      const bw = maxX - minX + 1;
      const bh = maxY - minY + 1;
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      if (area < 5 || bw < 2 || bh < 2) continue;
      if (bw > w * 0.15 || bh > h * 0.15) continue;
      let staff = null;
      for (const s of staffs) {
        const top = s.ys[0] - s.space * 1.7;
        const bottom = s.ys[4] + s.space * 1.7;
        if (cy >= top && cy <= bottom) {
          staff = s;
          break;
        }
      }
      if (!staff) continue;
      /*
       * 기둥이 붙은 음표도 놓치지 않도록
       * 너비/높이 비율 제한을 넓게 설정합니다.
       */
      const ratio = bw / bh;
      const maxNoteHeight = staff.space * 5.5;
      if (bh > maxNoteHeight) continue;
      if (ratio < 0.18 || ratio > 5.5) continue;
      if (area < Math.max(5, staff.space * staff.space * 0.025)) continue;
      components.push({
        x: cx,
        y: cy,
        minX, maxX, minY, maxY,
        bw, bh, area,
        staff
      });
    }
  }
  /*
   * 같은 음표 주변에서 여러 조각이 검출될 수 있습니다.
   * 가까운 x 좌표의 조각은 하나의 후보로 묶습니다.
   */
  components.sort((a,b) => a.x - b.x);
  const clusters = [];
  for (const c of components) {
    const tolerance = Math.max(5, c.staff.space * 0.8);
    let target = null;
    for (let i = clusters.length - 1; i >= 0; i--) {
      const prev = clusters[i];
      if (c.x - prev.maxX > tolerance * 2) break;
      if (
        Math.abs(c.x - prev.x) <= tolerance &&
        c.staff === prev.staff
      ) {
        target = prev;
        break;
      }
    }
    if (!target) {
      clusters.push({
        x:c.x,
        minX:c.minX,
        maxX:c.maxX,
        minY:c.minY,
        maxY:c.maxY,
        area:c.area,
        staff:c.staff
      });
    } else {
      target.minX = Math.min(target.minX, c.minX);
      target.maxX = Math.max(target.maxX, c.maxX);
      target.minY = Math.min(target.minY, c.minY);
      target.maxY = Math.max(target.maxY, c.maxY);
      target.area += c.area;
      target.x = (target.minX + target.maxX) / 2;
    }
  }
  clusters.sort((a,b) => a.x - b.x);
  /*
   * 지나치게 가까운 후보는 중복일 가능성이 높습니다.
   * 서로 다른 음표가 붙어 있는 경우도 있으므로
   * 간격을 너무 크게 잡지는 않습니다.
   */
  const unique = [];
  for (const c of clusters) {
    const x = Math.round(c.x / scale);
    const previous = unique[unique.length - 1];
    if (previous && Math.abs(previous.x - x) < 5) continue;
    unique.push({
      x,
      inst: $('instrument').value,
      dur: 1
    });
  }
  if (!unique.length) {
    throw new Error(
      `오선 ${staffs.length}개 그룹은 찾았지만 음표 후보를 찾지 못했습니다. 기호가 오선과 연결되어 있거나 악보 형식이 다를 수 있습니다.`
    );
  }
  return {
    notes: unique,
    staffCount: staffs.length,
    componentCount: components.length,
    threshold: best.threshold
  };
}
/* 인식 버튼 */
$('recognize').addEventListener('click', () => {
  if (!img || !img.complete || !img.naturalWidth) {
    status.textContent = '먼저 악보 이미지를 선택하세요.';
    return;
  }
  const btn = $('recognize');
  btn.disabled = true;
  status.textContent = '이미지의 오선과 음표 후보를 분석 중입니다…';
  setTimeout(() => {
    try {
      const result = recognize(img);
      notes = result.notes;
      render();
      status.textContent =
        `분석 완료: 오선 그룹 ${result.staffCount}개, ` +
        `음표 후보 ${notes.length}개. ` +
        `검출 기준 ${result.threshold}. 표에서 결과를 확인해 주세요.`;
    } catch (e) {
      console.error(e);
      status.textContent = '인식 실패: ' + (e.message || '알 수 없는 오류');
    } finally {
      btn.disabled = false;
    }
  }, 30);
});
/* 음표 추가 */
$('add').addEventListener('click', () => {
  notes.push({
    x: notes.length ? notes[notes.length - 1].x + 50 : 0,
    inst: $('instrument').value,
    dur: 1
  });
  render();
});
/* 오디오 */
function getAudio() {
  if (!audio) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) throw new Error('이 브라우저는 오디오 재생을 지원하지 않습니다.');
    audio = new AudioCtx();
  }
  return audio;
}
function clearPlaybackNodes() {
  for (const node of playbackNodes) {
    try { node.stop(); } catch (_) {}
    try { node.disconnect(); } catch (_) {}
  }
  playbackNodes = [];
}
function playHit(inst, when, dur) {
  const a = getAudio();
  const osc = a.createOscillator();
  const gain = a.createGain();
  const cfg = instruments[inst] || instruments.buk;
  osc.type = ['jing','kkwaeng','hat'].includes(inst) ? 'square' : 'triangle';
  osc.frequency.setValueAtTime(cfg.f, when);
  if (['buk','janggu'].includes(inst)) {
    osc.frequency.exponentialRampToValueAtTime(42, when + 0.13);
  }
  osc.connect(gain);
  gain.connect(a.destination);
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(
    ['jing','kkwaeng'].includes(inst) ? 0.16 : 0.5,
    when + 0.008
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    when + Math.max(0.07, Math.min(0.7, dur * 0.18))
  );
  osc.start(when);
  osc.stop(when + 0.9);
  playbackNodes.push(osc, gain);
}
/* 재생 */
$('play').addEventListener('click', async () => {
  if (!notes.length) {
    status.textContent = '먼저 악보를 인식하거나 음표를 추가하세요.';
    return;
  }
  try {
    const a = getAudio();
    await a.resume();
    clearPlaybackNodes();
    const bpm = Math.max(30, Math.min(240, Number($('tempo').value) || 100));
    const sorted = [...notes].sort((a,b) => a.x - b.x);
    let t = a.currentTime + 0.08;
    let prev = sorted[0].x;
    sorted.forEach((n, i) => {
      if (i > 0) {
        const distance = Math.max(0, n.x - prev);
        t += Math.max(0.08, Math.min(2, (distance / 50) * (60 / bpm)));
      }
      playHit(n.inst, t, n.dur);
      prev = n.x;
    });
    status.textContent = '재생을 시작했습니다.';
  } catch (e) {
    status.textContent = '재생 오류: ' + (e.message || e);
  }
});
/* 정지 */
$('stop').addEventListener('click', async () => {
  clearPlaybackNodes();
  if (audio) {
    try {
      await audio.suspend();
      await audio.resume();
    } catch (_) {}
  }
  status.textContent = '재생을 정지했습니다.';
});
/* MIDI 가변 길이 수 */
function vlq(v) {
  const out = [v & 127];
  while ((v = Math.floor(v / 128)) > 0) {
    out.unshift((v & 127) | 128);
  }
  return out;
}
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
/* MIDI 저장 */
$('midi').addEventListener('click', () => {
  if (!notes.length) {
    status.textContent = '저장할 음표가 없습니다.';
    return;
  }
  try {
    const bpm = Math.max(30, Math.min(240, Number($('tempo').value) || 100));
    const us = Math.round(60000000 / bpm);
    const events = [[
      0,
      [0xFF,0x51,3,(us >> 16) & 255,(us >> 8) & 255,us & 255]
    ]];
    [...notes].sort((a,b) => a.x - b.x).forEach(n => {
      const tick = Math.round(Math.max(0, n.x) / 50 * 120);
      const len = Math.max(30, Math.round(120 * n.dur));
      const gm = (instruments[n.inst] || instruments.buk).gm;
      events.push(
        [tick, [0x99, gm, 100]],
        [tick + len, [0x89, gm, 0]]
      );
    });
    events.sort((a,b) => a[0] - b[0]);
    const track = [];
    let last = 0;
    for (const [tick, data] of events) {
      track.push(...vlq(Math.max(0, tick - last)), ...data);
      last = tick;
    }
    track.push(0, 0xFF, 0x2F, 0);
    const len = track.length;
    const header = [
      0x4D,0x54,0x68,0x64,
      0,0,0,6,
      0,0,
      0,1,
      1,224,
      0x4D,0x54,0x72,0x6B,
      (len >>> 24) & 255,
      (len >>> 16) & 255,
      (len >>> 8) & 255,
      len & 255,
      ...track
    ];
    saveBlob(
      new Blob([new Uint8Array(header)], {type:'audio/midi'}),
      'gugak-score.mid'
    );
    status.textContent = 'MIDI 파일을 생성했습니다.';
  } catch (e) {
    console.error(e);
    status.textContent = 'MIDI 저장 오류: ' + (e.message || e);
  }
});
})();
</script>
